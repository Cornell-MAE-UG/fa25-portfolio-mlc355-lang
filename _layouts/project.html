---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  {% unless page.hide_cover %}
  <p class="project-cover"><img src="{{ page.image | relative_url }}" alt="{{ page.imagealt | default: page.title }}" class="project-image" /></p>
  {% endunless %}
  <div class="project-body">{{ content }}</div>
  <p class="technologies"><strong>Technologies Used</strong>: {{ page.technologies | join: ", " }}</p>
  <a href="{{ '/projects/' | relative_url }}" class="back-arrow"><span aria-hidden="true">←</span> Back to Projects</a>
</article>
