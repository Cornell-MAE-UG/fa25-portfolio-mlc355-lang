<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <nav class="site-nav container" aria-label="Main navigation">
      <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <ul class="nav-links">
        <li><a {% if page.url == '/' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Home</a></li>
        <li><a {% if page.url contains '/projects/' %}aria-current="{% if page.layout == 'project' %}true{% else %}page{% endif %}"{% endif %} href="{{ '/projects/' | relative_url }}">Projects</a></li>
        <li><a {% if page.url == '/cv/' %}aria-current="page"{% endif %} href="{{ '/cv/' | relative_url }}">CV</a></li>
      </ul>
    </nav>
  </header>
  <main id="main-content" tabindex="-1" class="container page-content {% if page.url == '/' %}home-page{% elsif page.url == '/cv/' %}cv-page{% elsif page.layout == 'project' %}project-page{% else %}projects-page{% endif %}">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="container">&copy; 2024 {{ site.name }}. All rights not reserved.</div>
  </footer>
</body>
</html>
